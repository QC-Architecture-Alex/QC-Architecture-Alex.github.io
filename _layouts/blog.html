---
layout: default
---

<h1>{{ page.title }}</h1>

<div class="blog-grid">
  {% for post in site.posts %}
    <a href="{{ post.url | relative_url }}" class="blog-card">

      {% if post.image %}
      <img src="{{ post.image | relative_url }}"
           alt="{{ post.title }}">
      {% endif %}

      <div class="card-content">
        <h2>{{ post.title }}</h2>

        <p>{{ post.description }}</p>

        <span class="date">
          {{ post.date | date: "%B %-d, %Y" }}
        </span>
      </div>

    </a>
  {% endfor %}
</div>
